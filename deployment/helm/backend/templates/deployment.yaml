---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Values.namespace }}
  name: {{ .Values.service.name }}
  labels:
    app.kubernetes.io/component: {{ .Values.service.name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ .Values.service.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: {{ .Values.service.name }}
    spec:
      containers:
        - name: {{ .Values.service.name }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            - name: APP_PORT
              value: {{ .Values.env.APP_PORT | quote }}
            - name: DB_HOST
              value: {{ .Values.env.DB_HOST | quote }}
            - name: DB_PORT
              value: {{ .Values.env.DB_PORT | quote }}
            - name: DB_USER
              value: {{ .Values.env.DB_USER | quote }}
            - name: DB_NAME
              value: {{ .Values.env.DB_NAME | quote }}
            - name: DB_SSL_MODE
              value: {{ .Values.env.DB_SSL_MODE | quote }}
            - name: DB_PASSWORD_SECRET_NAME
              value: {{ .Values.env.DB_PASSWORD_SECRET_NAME | quote }}
            - name: AZURE_TENANT_ID
              value: {{ .Values.env.AZURE_TENANT_ID | quote }}
            - name: AZURE_CLIENT_ID
              value: {{ .Values.env.AZURE_CLIENT_ID | quote }}
            - name: AZURE_CLIENT_SECRET
              value: {{ .Values.env.AZURE_CLIENT_SECRET | quote }}
            - name: AZURE_KEY_VAULT_URL
              value: {{ .Values.env.AZURE_KEY_VAULT_URL | quote }}