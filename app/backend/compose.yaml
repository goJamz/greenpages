# Backend project local development stack.
services:
  postgres:
    image: postgres:18.3
    container_name: greenpages-postgres
    environment:
      POSTGRES_DB: greenpages
      POSTGRES_USER: greenpages
      POSTGRES_PASSWORD: greenpages
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "greenpages", "-d", "greenpages"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  backend:
    build:
      context: ./backend
    container_name: greenpages-backend
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      APP_PORT: "8080"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USER: "greenpages"
      DB_PASSWORD: "greenpages"
      DB_NAME: "greenpages"
      DB_SSL_MODE: "disable"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
