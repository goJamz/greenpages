organization: expedition-0
security_group: ai2c
deployment_level: TEST

greenpages-backend:
  project_type: container
  dockerfile_folder: backend
  container_lifespan: PERSISTENT
  connection_context: INTERNAL
  zap:
    debug: true
    service_ports:
      - 5432
    gitlab_services:
      - name: registry.cdso.army.mil/ai2c/postgresql/database:548010
        alias: database
    database_init:
      type: postgres
      host: database
      user: postgres
      password: postgres
      database_name: postgres
      init_file_path: ./backend/db/configure.sql
    scanned_image_variables:
      DB_HOST: database
      DB_PORT: "5432"
      DB_USER: greenpages
      DB_PASSWORD: greenpages
      DB_NAME: greenpages
    wait: 10
