security_group: dami_im
organization: ai2c
deployment_level: PRODUCTION

dotnet-sdk:
  project_type: base
  dockerfile_folder: .
  container_lifespan: MULTIPLE
  connection_context: MULTIPLE

  container_spec:
    root_user: >-
      This is a base container image and should not have a USER instruction.
    non_minimized: >-
      This is a platform-provided base image template. Minimization is intentionally omitted becasue downstream application teams build on top of this image.

  mitigations:
    -  CVE-2024-10041: >-
        DESCRIPTION:
        A vulnerability was found in PAM. The secret information is stored in memory, where the 
        attacker can trigger the victim program to execute by sending characters to its standard input (stdin). 
        As this occurs, the attacker can train the branch predictor to execute an ROP chain speculatively. This 
        flaw could result in leaked passwords, such as those found in /etc/shadow while performing 
        authentications.
        MITIGATION:
        Operating system-level password-based authentication using PAM cannot be enabled or used 
        within this container; optimally all containers launched using this container image or its 
        derivatives will execute as a specific user at startup without requiring additional operating 
        system-level authentication. Applications running in the context of this or derivative 
        container images must use an authentication mechanism that is approved for the target runtime 
        environment that does not leverage password-based authentication using PAM. Derivative 
        containers may use this mitigation as long as they comply with the above guidance.
    - CVE-2025-45582: >-
        DESCRIPTION:
        GNU Tar through 1.35 allows file overwrite via directory traversal in crafted TAR archives, with a 
        certain two-step process. First, the victim must extract an archive that contains a ../ symlink to a 
        critical directory. Second, the victim must extract an archive that contains a critical file, specified 
        via a relative pathname that begins with the symlink name and ends with that critical file's name. Here, 
        the extraction follows the symlink and overwrites the critical file. This bypasses the protection 
        mechanism of "Member name contains '..'" that would occur for a single TAR archive that attempted to 
        specify the critical file via a ../ approach. For example, the first archive can contain "x -> 
        ../../../../../home/victim/.ssh" and the second archive can contain x/authorized_keys. This can affect 
        server applications that automatically extract any number of user-supplied TAR archives, and were 
        relying on the blocking of traversal. This can also affect software installation processes in which "tar 
        xf" is run more than once (e.g., when installing a package can automatically install two dependencies 
        that are set up as untrusted tarballs instead of official packages). NOTE: the official GNU Tar manual 
        has an otherwise-empty directory for each "tar xf" in its Security Rules of Thumb; however, third-party 
        advice leads users to run "tar xf" more than once into the same directory.     
        MITIGATION:
        This is a minimized base container and does not directly execute user-facing services or expose 
        any network interfaces. The vulnerable component is not invoked during the base image's lifecycle, as 
        the image is not used as a standalone runtime environment.
    - CVE-2026-4046: >-
        DESCRIPTION:
        The iconv() function in the GNU C Library versions 2.43 and earlier may crash due to an 
        assertion failure when converting inputs from the IBM1390 or IBM1399 character sets, which may be used 
        to remotely crash an application. This vulnerability can be trivially mitigated by removing the IBM1390 
        and IBM1399 character sets from systems that do not need them.hich may result in denial of service (
        infinite loop spinning the CPU).
        MITIGATION:
        The vulnerability was addressed by removing the IBM1390 and IBM1399 character sets from the 
        container. 
    -  CVE-2026-4437: >-
        DESCRIPTION:
        Calling gethostbyaddr or gethostbyaddr_r with a configured nsswitch.conf that specifies the 
        library's DNS backend in the GNU C Library version 2.34 to version 2.43 could, with a crafted response 
        from the configured DNS server, result in a violation of the DNS specification that causes the 
        application to treat a non-answer section of the DNS response as a valid answer.
        MITIGATION:
        This is a base container. This CVE can be mitigated by never using gethostbyaddr or 
        gethostbyaddr_r in derivative containers. 
    -  CVE-2026-4438: >-
        DESCRIPTION:
        Calling gethostbyaddr or gethostbyaddr_r with a configured nsswitch.conf that specifies the 
        library's DNS backend in the GNU C library version 2.34 to version 2.43 could result in an invalid DNS 
        hostname being returned to the caller in violation of the DNS specification.
        MITIGATION:
        This is a base container. This CVE can be mitigated by never using gethostbyaddr or 
        gethostbyaddr_r in derriviative containers.
    - CVE-2026-5450: >-
        DESCRIPTION:
        Calling the scanf family of functions with a %mc (malloc'd character match) in the GNU C Library 
        version 2.7 to version 2.43 with a format width specifier with an explicit width greater than 1024 
        could result in a one byte heap buffer overflow.
        MITIGATION:
        This is a base container. Derivative containers should upgrade dependencies. This is an embedded
        dependency and the CVE will be automatically mitigated during build once Ubuntu itself incorporates the 
        updated version.
    -  CVE-2026-5704: >-
        DESCRIPTION:
        A flaw was found in tar. A remote attacker could exploit this vulnerability by crafting a 
        malicious archive, leading to hidden file injection with fully attacker-controlled content. This 
        bypasses pre-extraction inspection mechanisms, potentially allowing an attacker to introduce malicious 
        files onto a system without detection.
        MITIGATION:
        This is a base container. Derivative containers should not use tar to extract archives at 
        runtime from external or untrusted sources. Verify checksums and signatures before calling tar.
    - CVE-2026-5928: >-
        DESCRIPTION:
        Calling the ungetwc function on a FILE stream with wide characters encoded in a character set that has
        overlaps between its single byte and multi-byte character encodings, in the GNU C Library version 2.43 or
        earlier, may result in an attempt to read bytes before an allocated buffer, potentially resulting in
        unintentional disclosure of neighboring data in the heap, or a program crash. A bug in the wide character
        pushback implementation (_IO_wdefault_pbackfail in libio/wgenops.c) causes ungetwc() to operate on the regular
        character buffer (fp->_IO_read_ptr) instead of the actual wide-stream read pointer
        (fp->_wide_data->_IO_read_ptr). The program crash may happen in cases where fp->_IO_read_ptr is not
        initialized and hence points to NULL. The buffer under-read requires a special situation where the input
        character encoding is such that there are overlaps between single byte representations and multibyte
        representations in that encoding, resulting in spurious matches. The spurious match case is not possible in
        the standard Unicode character sets.
        MITIGATION:
        This is a base container. Derivative containers should upgrade dependencies. This is an embedded
        dependency and the CVE will be automatically mitigated during build once Ubuntu itself incorporates the 
        updated version. Users are recommended to validate user-supplied character encoding formats prior to processing.
    -  CVE-2026-27456: >-
        DESCRIPTION:
        util-linux is a random collection of Linux utilities. Prior to version 2.41.4, a TOCTOU (
        Time-of-Check-Time-of-Use) vulnerability has been identified in the SUID binary /usr/bin/mount from util-
        linux. The mount binary, when setting up loop devices, validates the source file path with user 
        privileges via fork() + setuid() + realpath(), but subsequently re-canonicalizes and opens it with root 
        privileges (euid=0) without verifying that the path has not been replaced between both operations. 
        Neither O_NOFOLLOW, nor inode comparison, nor post-open fstat() are employed. This allows a local 
        unprivileged user to replace the source file with a symlink pointing to any root-owned file or device 
        during the race window, causing the SUID binary to open and mount it as root. Exploitation requires an 
        /etc/fstab entry with user,loop options whose path points to a directory where the attacker has write 
        permission, and that /usr/bin/mount has the SUID bit set (the default configuration on virtually all 
        Linux distributions). The impact is unauthorized read access to root-protected files and block devices, 
        including backup images, disk volumes, and any file containing a valid filesystem. This issue has been 
        patched in version 2.41.4.
        MITIGATION:
        This is a base container. Derivative containers should not use a /etc/fstab entry with 
        user,loop entries, SUID suppressed by runtime policy.
    - CVE-2026-40223: >-
        DESCRIPTION:
        In systemd 258 before 260, a local unprivileged user can trigger an assert when a 
        Delegate=yes and User=<unset> unit exists and is running.
        MITIGATION:
        This is a false positive. The cve match is on a checusum file that does not contain the vulnerable
        kernel code. No kernel code is present in this container image. Not exploitable.
    - CVE-2026-40224: >-
        DESCRIPTION:
        In systemd 259 before 260, there is local privilege escalation in systemd-machined because 
        varlink can be used to reach the root namespace.
        MITIGATION:
        This is a false positive. The cve match is on a checusum file that does not contain the vulnerable
        kernel code. No kernel code is present in this container image. Not exploitable.
    - CVE-2026-40225: >-
        DESCRIPTION:
        In udev in systemd before 260, local root execution can occur via malicious hardware 
        devices and unsanitized kernel output.
        MITIGATION:
        This is a false positive. The cve match is on a checusum file that does not contain the vulnerable
        kernel code. No kernel code is present in this container image. Not exploitable.
    - CVE-2026-40226: >-
        DESCRIPTION:
        In nspawn in systemd 233 through 259 before 260, an escape-to-host action can occur via a 
        crafted optional config file.
        MITIGATION:
        This is a false positive. The cve match is on a checusum file that does not contain the vulnerable
        kernel code. No kernel code is present in this container image. Not exploitable.
    - CVE-2026-40227: >-
        DESCRIPTION:
        In systemd 260 before 261, a local unprivileged user can trigger an assert via an IPC API 
        call with an array or map that has a null element.
        MITIGATION:
        This is a false positive. The cve match is on a checusum file that does not contain the vulnerable
        kernel code. No kernel code is present in this container image. Not exploitable.
    - CVE-2026-40228: >-
        DESCRIPTION:
        In systemd 259, systemd-journald can send ANSI escape sequences to the terminals of 
        arbitrary users when a "logger -p emerg" command is executed, if ForwardToWall=yes is set.
        MITIGATION:
        This is a false positive. The cve match is on a checusum file that does not contain the vulnerable
        kernel code. No kernel code is present in this container image. Not exploitable.
    - CVE-2026-41989: >-
        DESCRIPTION:
        Libgcrypt before 1.12.2 sometimes allows a heap-based buffer overflow and denial of service via 
        crafted ECDH ciphertext to gcry_pk_decrypt.
        MITIGATION:
        This is a base container. Derivative containers should upgrade dependencies. This is an embedded
        dependency and the CVE will be automatically mitigated during build once Ubuntu itself incorporates the 
        updated version.
    - CVE-2026-3832: >-
        DESCRIPTION:
        A flaw was found in gnutls. A remote attacker could exploit this vulnerability by presenting a specially crafted
        Online Certificate Status Protocol (OCSP) response during a TLS handshake. Due to a logic error in how gnutls processes
        multi-record OCSP responses, a client with OCSP verification enabled may incorrectly accept a revoked server
        certificate, potentially leading to a compromise of trust.
        MITIGATION:
        This is a base container image and does not itself configure or operate a GnuTLS TLS client workflow that
        performs OCSP response validation as an image-provided service. The vulnerable library is inherited from Ubuntu 24.04
        packages, and Ubuntu has not yet published a Noble package update for this CVE. Derivative images that directly use
        GnuTLS OCSP validation should consume the Ubuntu vendor fix once available.
    - CVE-2026-3833: >-
        DESCRIPTION:
        A flaw was found in gnutls. This vulnerability occurs because gnutls performs case-sensitive comparisons of
        `nameConstraints` labels, specifically for `dNSName` (DNS) or `rfc822Name` (email) constraints within `excludedSubtrees`
        or `permittedSubtrees`. A remote attacker can exploit this by crafting a leaf certificate with casing differences in the
        Subject Alternative Name (SAN), leading to a policy bypass where a certificate that should be rejected is instead
        accepted. This could result in unauthorized access or information disclosure.
        MITIGATION:
        This is a base container image and does not itself implement or operate application certificate-policy
        validation using GnuTLS nameConstraints processing. The vulnerable library is inherited from Ubuntu 24.04 packages, and
        Ubuntu has not yet published a Noble package update for this CVE. Derivative applications that directly rely on
        GnuTLS X.509 name constraint validation should consume the Ubuntu vendor fix once available.
    - CVE-2026-5260: >-
        DESCRIPTION:
        For a server using an RSA key backed by a PKCS#11 token, a client sending an extremely short premaster secret during
        an RSA key exchange could trigger a short heap overread.
        MITIGATION:
        This is a .NET SDK base container image and does not configure or operate a GnuTLS server using an RSA key
        backed by a PKCS#11 token. Exploitation requires that specific server-side cryptographic configuration. The vulnerable
        library is inherited from Ubuntu 24.04 packages, and Ubuntu has not yet published a Noble package update for this CVE.
        Derivative images that add this GnuTLS configuration should consume the Ubuntu vendor fix once available.
    - CVE-2026-5419: >-
        DESCRIPTION:
        The PKCS#7 padding check performed during decryption was not constant-time, potentially leaking information about
        the padding bytes through timing differences.
        MITIGATION:
        This is a .NET SDK base container image and does not itself decrypt attacker-controlled PKCS#7 data through
        GnuTLS as an image-provided service. The vulnerable library is inherited from Ubuntu 24.04 packages, and Ubuntu has not
        yet published a Noble package update for this CVE. Derivative applications that directly use GnuTLS PKCS#7 decryption
        should consume the Ubuntu vendor fix once available.
    - CVE-2026-5435: >-
        DESCRIPTION:
        The deprecated functions ns_printrrf, ns_printrr and fp_nquery in the GNU C Library version 2.2 and newer fail to
        enforce the caller-supplied buffer length, and can result in an out-of-bounds write when printing TSIG records.
        MITIGATION:
        This is a base container image. The affected GNU C Library functions ns_printrrf, ns_printrr, and fp_nquery are
        deprecated resolver debugging interfaces and are not invoked by the .NET SDK base image during normal image startup
        or lifecycle. Ubuntu 24.04 has not yet published a Noble package update for this CVE. Derivative applications should
        avoid using these deprecated interfaces and should consume the Ubuntu vendor fix once available.
    - CVE-2026-6238: >-
        DESCRIPTION:
        The deprecated functions ns_printrrf, ns_printrr and fp_nquery in the GNU C Library version 2.2 and newer fail to
        validate the RDATA content against the RDATA length in a DNS response when processing LOC, CERT, TKEY or TSIG records,
        which may allow an attacker to craft a DNS response, causing a target application to crash or read uninitialized
        memory. These functions are for application debugging only and hence not in the path of code executed by the DNS
        resolver. Further, they have been deprecated since version 2.34 and should not be used by any new applications.
        Applications should consider porting away from these interfaces since they may be removed in future versions.
        MITIGATION:
        This is a base container image. The affected GNU C Library functions ns_printrrf, ns_printrr, and fp_nquery are
        deprecated resolver debugging interfaces and are not part of the normal DNS resolver execution path. They are not
        invoked by the .NET SDK base image during normal image startup or lifecycle. Ubuntu 24.04 has not yet published a
        Noble package update for this CVE. Derivative applications should avoid using these deprecated interfaces and should
        consume the Ubuntu vendor fix once available.
    - CVE-2026-33845: >-
        DESCRIPTION:
        A flaw in GnuTLS DTLS handshake parsing allows malformed fragments with zero length and non-zero offset, leading to
        an integer underflow during reassembly and resulting in an out-of-bounds read. This issue is remotely exploitable and
        may cause information disclosure or denial of service.
        MITIGATION:
        This is a .NET SDK base container image and does not expose or configure a GnuTLS DTLS endpoint.
        Exploitation requires processing attacker-controlled malformed DTLS handshake fragments. The vulnerable library is
        inherited from Ubuntu 24.04 packages, and Ubuntu has not yet published a Noble package update for this CVE. Derivative
        images that add GnuTLS DTLS services should consume the Ubuntu vendor fix once available.
    - CVE-2026-33846: >-
        DESCRIPTION:
        A heap buffer overflow vulnerability exists in the DTLS handshake fragment reassembly logic of GnuTLS. The issue arises
        in merge_handshake_packet() where incoming handshake fragments are matched and merged based solely on handshake type,
        without validating that the message_length field remains consistent across all fragments of the same logical message.
        An attacker can exploit this by sending crafted DTLS fragments with conflicting message_length values, causing the
        implementation to allocate a buffer based on a smaller initial fragment and subsequently write beyond its bounds using
        larger, inconsistent fragments. Because the merge operation does not enforce proper bounds checking against the allocated
        buffer size, this results in an out-of-bounds write on the heap. The vulnerability is remotely exploitable without
        authentication via the DTLS handshake path and can lead to application crashes or potential memory corruption.
        MITIGATION:
        This is a .NET SDK base container image and does not expose or configure a GnuTLS DTLS endpoint. Exploitation
        requires processing attacker-controlled malformed DTLS handshake fragments. The vulnerable library is inherited from
        Ubuntu 24.04 packages, and Ubuntu has not yet published a Noble package update for this CVE. Derivative images that add
        GnuTLS DTLS services should consume the Ubuntu vendor fix once available.
    - CVE-2026-42009: >-
        DESCRIPTION:
        The comparator function used for ordering DTLS packets by sequence numbers did not follow qsort comparator contracts in case
        of packets with duplicate sequence numbers, which could lead to undefined behaviour.
        MITIGATION:
        This is an Ubuntu 24.04 glibc-based .NET SDK base container image. Upstream GnuTLS states that this issue does
        not affect modern glibc-based systems that do not fall back to a quicksort implementation. In addition, this image does not
        expose or configure a GnuTLS DTLS endpoint. The finding is retained for transparency, and the inherited Ubuntu package should
        continue to be updated when a vendor package refresh becomes available.
    - CVE-2026-42010: >-
        DESCRIPTION:
        A flaw was found in gnutls. Servers configured with RSA-PSK wrongfully matched usernames containing a NUL character with
        truncated usernames. A remote attacker could exploit this by sending a specially crafted username, leading to an
        authentication bypass. This vulnerability allows an attacker to gain unauthorized access by circumventing the authentication process.
        MITIGATION:
        This is a .NET SDK base container image and does not configure or operate a GnuTLS server using RSA-PSK authentication.
        Exploitation requires a server-side GnuTLS RSA-PSK configuration that processes attacker-controlled usernames. The vulnerable library
        is inherited from Ubuntu 24.04 packages, and Ubuntu has not yet published a Noble package update for this CVE. Derivative images that
        add GnuTLS RSA-PSK services should consume the Ubuntu vendor fix once available.
    - CVE-2026-42011: >-
        DESCRIPTION:
        A flaw was found in gnutls. This vulnerability occurs because permitted name constraints were incorrectly ignored when previous
        Certificate Authorities (CAs) only had excluded name constraints. A remote attacker could exploit this to bypass critical name constraint
        checks during certificate validation. This bypass could lead to the acceptance of invalid certificates, potentially enabling spoofing or
        man-in-the-middle attacks against affected systems.
        MITIGATION:
        This is a base container image and does not itself implement or operate certificate-chain name constraint enforcement
        using GnuTLS. The vulnerable library is inherited from Ubuntu 24.04 packages, and Ubuntu has not yet published a Noble package update for
        this CVE. Derivative applications that directly rely on GnuTLS certificate name constraint validation should consume the Ubuntu vendor
        fix once available.
    - CVE-2026-42012: >-
        DESCRIPTION:
        Certificates containing URI or SRV Subject Alternative Names would fall back to checking DNS hostnames against Common Name, allowing
        potential misuse of such certificates beyond their original purpose.
        MITIGATION:
        This is a base container image and does not itself implement or operate GnuTLS hostname validation logic for certificates
        containing URI or SRV Subject Alternative Names. The vulnerable library is inherited from Ubuntu 24.04 packages, and Ubuntu has not yet
        published a Noble package update for this CVE. Derivative applications that directly rely on this GnuTLS certificate-validation behavior
        should consume the Ubuntu vendor fix once available.
    - CVE-2026-42013: >-
        DESCRIPTION:
        Validation of certificates with oversized Subject Alternative Names would fall back to checking DNS hostnames against Common Name.
        MITIGATION:
        This is a base container image and does not itself implement or operate GnuTLS hostname validation logic for certificates
        with oversized Subject Alternative Names. The vulnerable library is inherited from Ubuntu 24.04 packages, and Ubuntu has not yet
        published a Noble package update for this CVE. Derivative applications that directly rely on this GnuTLS certificate-validation
        behavior should consume the Ubuntu vendor fix once available.
    - CVE-2026-42014: >-
        DESCRIPTION:
        Changing the Security Officer PIN with gnutls_pkcs11_token_set_pin() with oldpin == NULL for a token lacking a protected
        authentication path led to a use-after-free.
        MITIGATION:
        This is a .NET SDK base container image and does not perform PKCS#11 Security Officer PIN management through
        gnutls_pkcs11_token_set_pin(). The vulnerable library is inherited from Ubuntu 24.04 packages, and Ubuntu has not yet published
        a Noble package update for this CVE. Derivative applications that directly use this GnuTLS PKCS#11 token-management function
        should consume the Ubuntu vendor fix once available.
    - CVE-2026-42015: >-
        DESCRIPTION:
        Appending to a PKCS#12 bag that already contained 32 elements could write past the bag's internal array.
        MITIGATION:
        This is a .NET SDK base container image and does not create or append to PKCS#12 bags through GnuTLS as part of the image
        lifecycle. The vulnerable library is inherited from Ubuntu 24.04 packages, and Ubuntu has not yet published a Noble package update
        for this CVE. Derivative applications that directly manipulate PKCS#12 bags through GnuTLS should consume the Ubuntu vendor fix once available.
    - CVE-2026-43916: >-
        DESCRIPTION:
        pam_authnft is a PAM session module binding nftables firewall rules to authenticated sessions via cgroupv2 inodes. Prior to 0.2.0-alpha,
        a heap buffer over-read in peer_lookup_tcp (src/peer_lookup.c:134, prior to the fix) allowed a crafted NETLINK_SOCK_DIAG reply to slip
        past the message-size check, then dereference past the end of the allocation. This vulnerability is fixed in 0.2.0-alpha.
        MITIGATION:
        False Positive. CVE-2026-43916 affects pam_authnft, a third-party PAM session module that binds nftables firewall rules to
        authenticated sessions via cgroupv2 inodes (fixed in pam_authnft 0.2.0-alpha). pam_authnft is not installed in this image.